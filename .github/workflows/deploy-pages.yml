name: Deploy Nama to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and verify Nama
        id: nama
        continue-on-error: true
        run: bash ./build.sh

      - name: Restore last verified Nama site when current build fails
        if: steps.nama.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 43666846692
          github-token: ${{ github.token }}
          path: ./nama-baseline

      - name: Unpack verified Nama baseline
        if: steps.nama.outcome == 'failure'
        run: |
          mkdir -p public
          tar -xf nama-baseline/artifact.tar -C public

      - name: Add Seega game without changing Nama files
        run: |
          mkdir -p public/seega
          cp -a seega-game/. public/seega/
          node --check public/seega/app.js
          node --check public/seega/game.mjs
          node --check public/seega/socket.io/socket.io.js
          node --check public/seega/sw.js
          test -s public/seega/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
