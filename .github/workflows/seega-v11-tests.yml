name: Seega Royale V11 regression tests
on:
  push:
    branches:
      - seega-royale-v11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V11
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run gameplay and cloud contract tests
        run: |
          node --version
          node --check public/app.js
          node --check public/cloud-social.js
          node --check public/friend-call.js
          node --test tests*.mjs
