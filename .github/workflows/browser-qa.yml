name: Seega Royale Android UI and browser regression
on:
  push:
    branches:
      - seega-royale-v11
    paths:
      - 'public/**'
      - 'qa/browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Mobile and desktop smoke test
        run: npm run test:browser
      - name: Keep design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seega-ui-screenshots
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 14
